version = 1
revision = 3
requires-python = ">=3.10"
resolution-markers = [
    "python_full_version >= '3.12'",
    "python_full_version < '3.12'",
]

[[package]]
name = "certifi"
version = "2024.8.30"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/certifi-2024.8.30.tar.gz", hash = "sha256:00", size = 1 }

[[package]]
name = "example-uv-app"
version = "0.3.0"
source = { editable = "." }
dependencies = [
    { name = "requests" },
    { name = "internal-lib" },
]

[package.optional-dependencies]
fast = [
    { name = "numpy" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[[package]]
name = "internal-lib"
version = "1.0.0"
source = { git = "https://github.com/example/internal-lib?rev=v1.0.0#abc123" }

[[package]]
name = "numpy"
version = "1.26.4"
source = { registry = "https://pypi.org/simple" }
resolution-markers = [
    "python_full_version < '3.12'",
]

[[package]]
name = "numpy"
version = "2.1.0"
source = { registry = "https://pypi.org/simple" }
resolution-markers = [
    "python_full_version >= '3.12'",
]

[[package]]
name = "pytest"
version = "8.3.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.32.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
]
